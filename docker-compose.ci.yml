name: caseclosed-ci

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: caseclosed_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caseclosed_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/caseclosed_test
    depends_on:
      postgres:
        condition: service_healthy
    command: ["test"]
